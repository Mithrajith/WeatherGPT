[project]
name = "weather-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariharan P R", email = "prhariharan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "redis>=5.0.3",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
weather-gpt = "weather_gpt.main:app"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

